<svg xmlns="http://www.w3.org/2000/svg"
     width="420"
     height="560"
     viewBox="0 0 420 560"
     role="img"
     aria-labelledby="title description">
  <title id="title">Xurshid Muhammadiyev — mobile profile banner</title>
  <desc id="description">A dark mobile profile banner for a system administrator and network engineer in Tashkent.</desc>

  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#101b2d"/>
    </linearGradient>
    <linearGradient id="project" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0c2d48"/>
      <stop offset="1" stop-color="#123522"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24"
            fill="none"
            stroke="#58a6ff"
            stroke-width="1"
            opacity="0.07"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="420" height="560" rx="24" fill="url(#canvas)"/>
  <rect width="420" height="560" rx="24" fill="url(#grid)"/>
  <rect x="20" y="20" width="380" height="520" rx="20"
        fill="#161b22" stroke="#30363d" filter="url(#shadow)"/>

  <g font-family="'Segoe UI', Ubuntu, Arial, sans-serif">
    <circle cx="46" cy="52" r="5" fill="#3fb950"/>
    <text x="60" y="58" font-size="14" font-weight="600" letter-spacing="1.3" fill="#8b949e">
      TASHKENT / UZ
    </text>

    <text x="40" y="99" font-family="Consolas, 'Courier New', monospace"
          font-size="17" font-weight="700" fill="#3fb950">$ whoami</text>
    <text x="39" y="145" font-size="37" font-weight="800" letter-spacing="-1" fill="#58a6ff">
      XURSHID
    </text>
    <text x="39" y="184" font-size="37" font-weight="800" letter-spacing="-1" fill="#f0f6fc">
      MUHAMMADIYEV
    </text>
    <text x="40" y="218" font-size="17" font-weight="600" fill="#f0f6fc">System Administrator</text>
    <text x="40" y="243" font-size="17" font-weight="600" fill="#f0f6fc">Network Engineer</text>
    <text x="40" y="271" font-size="15" fill="#8b949e">Infrastructure &#183; DevOps &#183; Automation</text>

    <line x1="40" y1="296" x2="380" y2="296" stroke="#30363d"/>
  </g>

  <g font-family="Consolas, 'Courier New', monospace">
    <text x="40" y="331" font-size="16" font-weight="700" fill="#3fb950">$ focus</text>
    <text x="40" y="358" font-size="16" fill="#f0f6fc">networking / infrastructure</text>
    <text x="40" y="382" font-size="16" fill="#f0f6fc">automation / AI workflows</text>

    <text x="40" y="421" font-size="16" font-weight="700" fill="#3fb950">$ stack</text>
    <text x="40" y="448" font-size="15" fill="#f0f6fc">MikroTik  Linux  Docker</text>
    <text x="40" y="472" font-size="15" fill="#f0f6fc">Python    Git    Codex</text>
  </g>

  <rect x="40" y="493" width="340" height="31" rx="9" fill="url(#project)" stroke="#2ea043"/>
  <text x="55" y="514" font-family="Consolas, 'Courier New', monospace"
        font-size="13" font-weight="700" fill="#3fb950">BUILDING</text>
  <text x="128" y="514" font-family="'Segoe UI', Ubuntu, Arial, sans-serif"
        font-size="16" font-weight="700" fill="#58a6ff">SIGAMIZ</text>
  <text x="199" y="514" font-family="'Segoe UI', Ubuntu, Arial, sans-serif"
        font-size="13" fill="#b1bac4">for students</text>
</svg>
