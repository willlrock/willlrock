<svg xmlns="http://www.w3.org/2000/svg"
     width="420"
     height="560"
     viewBox="0 0 420 560"
     role="img"
     aria-labelledby="title description">
  <title id="title">Xurshid Muhammadiyev — mobile profile banner</title>
  <desc id="description">A light mobile profile banner for a system administrator and network engineer in Tashkent.</desc>

  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f8fa"/>
      <stop offset="1" stop-color="#eef5ff"/>
    </linearGradient>
    <linearGradient id="project" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ddf4ff"/>
      <stop offset="1" stop-color="#dafbe1"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24"
            fill="none"
            stroke="#0969da"
            stroke-width="1"
            opacity="0.055"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1f2328" flood-opacity="0.09"/>
    </filter>
  </defs>

  <rect width="420" height="560" rx="24" fill="url(#canvas)"/>
  <rect width="420" height="560" rx="24" fill="url(#grid)"/>
  <rect x="20" y="20" width="380" height="520" rx="20"
        fill="#ffffff" stroke="#d0d7de" filter="url(#shadow)"/>

  <g font-family="'Segoe UI', Ubuntu, Arial, sans-serif">
    <circle cx="46" cy="52" r="5" fill="#1a7f37"/>
    <text x="60" y="58" font-size="14" font-weight="600" letter-spacing="1.3" fill="#57606a">
      TASHKENT / UZ
    </text>

    <text x="40" y="99" font-family="Consolas, 'Courier New', monospace"
          font-size="17" font-weight="700" fill="#1a7f37">$ whoami</text>
    <text x="39" y="145" font-size="37" font-weight="800" letter-spacing="-1" fill="#0969da">
      XURSHID
    </text>
    <text x="39" y="184" font-size="37" font-weight="800" letter-spacing="-1" fill="#24292f">
      MUHAMMADIYEV
    </text>
    <text x="40" y="218" font-size="17" font-weight="600" fill="#24292f">System Administrator</text>
    <text x="40" y="243" font-size="17" font-weight="600" fill="#24292f">Network Engineer</text>
    <text x="40" y="271" font-size="15" fill="#57606a">Infrastructure &#183; DevOps &#183; Automation</text>

    <line x1="40" y1="296" x2="380" y2="296" stroke="#d0d7de"/>
  </g>

  <g font-family="Consolas, 'Courier New', monospace">
    <text x="40" y="331" font-size="16" font-weight="700" fill="#1a7f37">$ focus</text>
    <text x="40" y="358" font-size="16" fill="#24292f">networking / infrastructure</text>
    <text x="40" y="382" font-size="16" fill="#24292f">automation / AI workflows</text>

    <text x="40" y="421" font-size="16" font-weight="700" fill="#1a7f37">$ stack</text>
    <text x="40" y="448" font-size="15" fill="#24292f">MikroTik  Linux  Docker</text>
    <text x="40" y="472" font-size="15" fill="#24292f">Python    Git    Codex</text>
  </g>

  <rect x="40" y="493" width="340" height="31" rx="9" fill="url(#project)" stroke="#b6d7c2"/>
  <text x="55" y="514" font-family="Consolas, 'Courier New', monospace"
        font-size="13" font-weight="700" fill="#116329">BUILDING</text>
  <text x="128" y="514" font-family="'Segoe UI', Ubuntu, Arial, sans-serif"
        font-size="16" font-weight="700" fill="#0969da">SIGAMIZ</text>
  <text x="199" y="514" font-family="'Segoe UI', Ubuntu, Arial, sans-serif"
        font-size="13" fill="#57606a">for students</text>
</svg>
