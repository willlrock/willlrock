<svg xmlns="http://www.w3.org/2000/svg"
     width="900"
     height="420"
     viewBox="0 0 900 420"
     role="img"
     aria-labelledby="title description">
  <title id="title">Xurshid Muhammadiyev — systems, networks, and automation</title>
  <desc id="description">A dark profile banner for a system administrator and network engineer based in Tashkent.</desc>

  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#101b2d"/>
    </linearGradient>
    <linearGradient id="project" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0c2d48"/>
      <stop offset="1" stop-color="#123522"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28"
            fill="none"
            stroke="#58a6ff"
            stroke-width="1"
            opacity="0.07"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="900" height="420" rx="24" fill="url(#canvas)"/>
  <rect width="900" height="420" rx="24" fill="url(#grid)"/>

  <g opacity="0.34" fill="none" stroke="#58a6ff" stroke-width="1.5">
    <path d="M18 72 H142 L184 114 H314"/>
    <path d="M744 18 V67 L786 109 H882"/>
    <path d="M18 366 H112 L154 324 H246"/>
    <circle cx="142" cy="72" r="4" fill="#58a6ff"/>
    <circle cx="184" cy="114" r="4" fill="#58a6ff"/>
    <circle cx="744" cy="67" r="4" fill="#58a6ff"/>
    <circle cx="786" cy="109" r="4" fill="#58a6ff"/>
    <circle cx="112" cy="366" r="4" fill="#58a6ff"/>
    <circle cx="154" cy="324" r="4" fill="#58a6ff"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="28" y="28" width="520" height="364" rx="20" fill="#161b22" stroke="#30363d"/>
    <rect x="568" y="28" width="304" height="364" rx="20" fill="#161b22" stroke="#30363d"/>
  </g>

  <g font-family="'Segoe UI', Ubuntu, Arial, sans-serif">
    <circle cx="56" cy="61" r="5" fill="#3fb950"/>
    <text x="70" y="67" font-size="15" font-weight="600" letter-spacing="1.4" fill="#8b949e">
      TASHKENT / UZ
    </text>

    <text x="52" y="113" font-family="Consolas, 'Courier New', monospace"
          font-size="17" font-weight="700" fill="#3fb950">$ whoami</text>
    <text x="50" y="164" font-size="43" font-weight="800" letter-spacing="-1.2" fill="#58a6ff">
      XURSHID
    </text>
    <text x="50" y="208" font-size="43" font-weight="800" letter-spacing="-1.2" fill="#f0f6fc">
      MUHAMMADIYEV
    </text>

    <text x="52" y="244" font-size="18" font-weight="600" fill="#f0f6fc">
      System Administrator &#183; Network Engineer
    </text>
    <text x="52" y="272" font-size="17" fill="#8b949e">
      Reliable infrastructure, DevOps, and useful automation.
    </text>

    <rect x="50" y="305" width="468" height="58" rx="14" fill="url(#project)" stroke="#2ea043"/>
    <text x="70" y="329" font-family="Consolas, 'Courier New', monospace"
          font-size="13" font-weight="700" letter-spacing="1.1" fill="#3fb950">BUILDING</text>
    <text x="70" y="350" font-size="20" font-weight="700" fill="#58a6ff">SIGAMIZ</text>
    <text x="166" y="350" font-size="15" fill="#b1bac4">roommate map for students</text>
  </g>

  <g font-family="Consolas, 'Courier New', monospace">
    <circle cx="595" cy="57" r="5" fill="#f85149"/>
    <circle cx="613" cy="57" r="5" fill="#d29922"/>
    <circle cx="631" cy="57" r="5" fill="#3fb950"/>
    <text x="651" y="63" font-size="13" fill="#8b949e">profile.sh</text>

    <text x="594" y="103" font-size="16" font-weight="700" fill="#3fb950">$ focus</text>
    <text x="594" y="130" font-size="17" fill="#f0f6fc">networking</text>
    <text x="594" y="154" font-size="17" fill="#f0f6fc">infrastructure</text>
    <text x="594" y="178" font-size="17" fill="#f0f6fc">automation</text>

    <line x1="594" y1="204" x2="846" y2="204" stroke="#30363d"/>

    <text x="594" y="238" font-size="16" font-weight="700" fill="#3fb950">$ stack</text>
    <text x="594" y="266" font-size="16" fill="#f0f6fc">MikroTik  Linux</text>
    <text x="594" y="291" font-size="16" fill="#f0f6fc">Docker    Python</text>
    <text x="594" y="316" font-size="16" fill="#f0f6fc">Git       Codex</text>

    <rect x="594" y="340" width="252" height="29" rx="8" fill="#123522"/>
    <text x="607" y="360" font-size="13" font-weight="700" fill="#56d364">systems: operational</text>
  </g>
</svg>
